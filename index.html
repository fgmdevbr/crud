<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUD Básico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>CRUD Básico</h1>

    <form id="form">
      <input type="hidden" id="itemId">

      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="field">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="3"></textarea>
      </div>

      <div class="actions">
        <button type="submit" id="btnSalvar">Adicionar</button>
        <button type="button" id="btnCancelar" class="secondary hidden">Cancelar</button>
      </div>
    </form>

    <div class="list-header">
      <h2>Itens</h2>
      <input type="text" id="busca" placeholder="Buscar...">
    </div>

    <table id="tabela">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <p id="vazio" class="hidden">Nenhum item cadastrado.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
