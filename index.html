<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Pacientes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Pacientes</h1>

    <form id="form">
      <input type="hidden" id="itemId">

      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>
      </div>

      <div class="field">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required>
      </div>

      <div class="field">
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" required>
      </div>

      <div class="field">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
      </div>

      <div class="field">
        <label for="convenio">Convênio / Plano de saúde</label>
        <input type="text" id="convenio">
      </div>

      <div class="field">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" rows="3"></textarea>
      </div>

      <div class="actions">
        <button type="submit" id="btnSalvar">Adicionar</button>
        <button type="button" id="btnCancelar" class="secondary hidden">Cancelar</button>
      </div>
    </form>

    <div class="list-header">
      <h2>Pacientes</h2>
      <input type="text" id="busca" placeholder="Buscar...">
    </div>

    <table id="tabela">
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Nascimento</th>
          <th>Telefone</th>
          <th>Convênio</th>
          <th>Observações</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <p id="vazio" class="hidden">Nenhum paciente cadastrado.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
